                    "fontFamily": {

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .clean-shadow {
            box-shadow: 0 4px 20px -2px rgba(0, 77, 115, 0.1);
        }
    </style>
<style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body selection:bg-primary-container selection:text-white overflow-hidden">
<!-- Clean Airy Background -->
<div class="fixed inset-0 z-0">
<div class="absolute inset-0 bg-[radial-gradient(circle_at_top_right,_var(--tw-gradient-stops))] from-primary/5 via-transparent to-transparent"></div>
<div class="absolute bottom-0 left-0 w-full h-1/2 bg-gradient-to-t from-secondary/5 to-transparent"></div>
</div>
<!-- Main Login Container -->
<main class="relative z-10 flex flex-col items-center justify-between min-h-screen px-6 py-16">
<!-- Top App Bar -->
<div class="w-full flex justify-center pt-8">
<!-- Brand Identity Anchor -->
<div class="flex flex-col items-center gap-4">
<div class="w-20 h-20 rounded-2xl bg-primary flex items-center justify-center clean-shadow rotate-3 hover:rotate-0 transition-transform duration-500">
<span class="material-symbols-outlined text-4xl text-white" style="font-variation-settings: &quot;FILL&quot; 1;">flight_takeoff</span>
</div>
</div>
</div>
<!-- Center Content: Branding -->
<div class="flex flex-col items-center text-center gap-4">
<h1 class="font-display text-4xl font-bold tracking-tight text-primary uppercase">TRIP PLANNER</h1>
<p class="font-body text-on-surface-variant text-base font-medium leading-relaxed whitespace-nowrap">친구들과 함께 여행 일정을 만들어보세요</p>
</div>
<!-- Bottom Area: Actions & Legal -->
<div class="w-full max-w-sm flex flex-col gap-12 items-center">
<!-- Google Login Button -->
<button class="w-full py-4 px-6 rounded-full flex items-center justify-center gap-4 bg-white/40 backdrop-blur-md border border-white/40 hover:bg-white/60 hover:border-white/60 active:scale-[0.98] transition-all duration-300 clean-shadow">
<div class="w-6 h-6 flex items-center justify-center">
<svg class="w-full h-full" viewBox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.66l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
</div>
<span class="font-label text-on-surface font-semibold tracking-tight">Google로 로그인</span>
</button>
<!-- Legal Links -->
<div class="flex flex-col items-center gap-3">
<div class="flex gap-6 text-[11px] font-medium tracking-wide text-outline">
<a class="hover:text-primary transition-colors" href="#">Terms of Service</a>
<a class="hover:text-primary transition-colors" href="#">Privacy Policy</a>
</div>
<p class="text-[10px] font-medium text-outline/60 text-center uppercase tracking-widest">© 2024 TRIP PLANNER. ALL RIGHTS RESERVED.</p>
</div>
</div>
</main>
<!-- Visual Polish: Soft Gradients -->
<div class="fixed top-0 right-0 w-[500px] h-[500px] bg-primary/5 blur-[120px] rounded-full -mr-64 -mt-64 z-0 pointer-events-none"></div>
<div class="fixed bottom-0 left-0 w-[400px] h-[400px] bg-secondary/10 blur-[100px] rounded-full -ml-48 -mb-48 z-0 pointer-events-none"></div>


</body></html>
