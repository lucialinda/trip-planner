<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>여행 플래너</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary: #4f7eff;
    --primary-dark: #3a66e0;
    --bg: #f5f6fa;
    --card: #fff;
    --border: #e2e5ed;
    --text: #1a1d2e;
    --muted: #8a91a8;
    --danger: #ff4f4f;
    --success: #2ecc71;
    --tab-h: 56px;
    --header-h: 56px;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* ── Auth screen ── */
  #auth-screen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px; gap: 24px;
  }
  #auth-screen h1 { font-size: 28px; font-weight: 700; }
  #auth-screen p { color: var(--muted); font-size: 15px; }
  .btn-google {
    display: flex; align-items: center; gap: 10px; padding: 12px 24px;
    background: #fff; border: 1px solid var(--border); border-radius: 8px;
    font-size: 15px; font-weight: 600; cursor: pointer; transition: background .15s;
  }
  .btn-google:hover { background: #f0f2f9; }
  .btn-google img { width: 20px; height: 20px; }

  /* ── Trip select screen ── */
  #trip-screen { display: none; max-width: 480px; margin: 0 auto; padding: 24px 16px; }
  #trip-screen h2 { font-size: 20px; font-weight: 700; margin-bottom: 16px; }
  .trip-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .trip-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; cursor: pointer; transition: border-color .15s;
  }
  .trip-card:hover { border-color: var(--primary); }
  .trip-card .tc-name { font-weight: 600; font-size: 16px; }
  .trip-card .tc-date { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .divider { text-align: center; color: var(--muted); font-size: 13px; margin: 16px 0; position: relative; }
  .divider::before, .divider::after {
    content: ''; position: absolute; top: 50%; width: 42%; height: 1px; background: var(--border);
  }
  .divider::before { left: 0; } .divider::after { right: 0; }

  /* ── Create trip form ── */
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--muted); }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 15px; outline: none; transition: border-color .15s;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--primary); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 11px 20px; border-radius: 8px; font-size: 15px; font-weight: 600;
    cursor: pointer; border: none; transition: background .15s, opacity .15s;
  }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-primary { background: var(--primary); color: #fff; width: 100%; }
  .btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
  .btn-outline { background: transparent; color: var(--primary); border: 1px solid var(--primary); }
  .btn-outline:hover { background: #eef1ff; }
  .btn-sm { padding: 7px 14px; font-size: 13px; }
  .btn-danger { background: var(--danger); color: #fff; }

  /* ── Join by code ── */
  .join-row { display: flex; gap: 8px; }
  .join-row input { flex: 1; }

  /* ── App shell ── */
  #app { display: none; height: 100vh; display: none; flex-direction: column; }
  #app.active { display: flex; }

  /* Header */
  #app-header {
    height: var(--header-h); background: var(--card); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 16px; gap: 12px; flex-shrink: 0; position: sticky; top: 0; z-index: 10;
  }
  #trip-title { font-size: 17px; font-weight: 700; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #trip-dates { font-size: 12px; color: var(--muted); }
  .icon-btn { background: none; border: none; cursor: pointer; padding: 6px; border-radius: 6px; display: flex; align-items: center; }
  .icon-btn:hover { background: var(--bg); }
  .icon-btn svg { width: 20px; height: 20px; stroke: var(--muted); }

  /* Tab nav */
  #tab-nav {
    display: flex; border-bottom: 1px solid var(--border); background: var(--card);
    flex-shrink: 0; position: sticky; top: var(--header-h); z-index: 9;
  }
  .tab-btn {
    flex: 1; padding: 14px 4px; font-size: 13px; font-weight: 600; color: var(--muted);
    background: none; border: none; cursor: pointer; border-bottom: 2px solid transparent;
    transition: color .15s, border-color .15s;
  }
  .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

  /* Tab content */
  #tab-content { flex: 1; overflow-y: auto; padding: 16px; }
  .tab-panel { display: none; max-width: 600px; margin: 0 auto; }
  .tab-panel.active { display: block; }

  /* ── Itinerary tab ── */
  .day-block { margin-bottom: 24px; }
  .day-header {
    font-size: 14px; font-weight: 700; color: var(--primary);
    margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between;
  }
  .place-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 8px; display: flex; align-items: flex-start; gap: 10px;
  }
  .swipe-item { position: relative; overflow: hidden; margin-bottom: 8px; border-radius: 10px; touch-action: pan-y; }
  .swipe-item .place-card { position: relative; z-index: 1; margin-bottom: 0; transition: transform .18s ease; }
  .swipe-item.open .place-card { transform: translateX(-128px); }
  .place-actions {
    position: absolute; top: 0; right: 0; bottom: 0; display: flex; width: 128px;
    border-radius: 0 10px 10px 0; overflow: hidden;
  }
  .place-action {
    flex: 1; border: none; color: #fff; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .place-action.edit { background: var(--primary); }
  .place-action.delete { background: var(--danger); }
  .place-info { flex: 1; min-width: 0; }
  .place-name { font-weight: 600; font-size: 15px; }
  .place-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .place-note { font-size: 13px; color: var(--text); margin-top: 4px; }
  .place-menu-btn {
    align-self: flex-start; width: 28px; height: 28px; border: none; border-radius: 6px;
    background: transparent; color: var(--muted); font-size: 18px; line-height: 1; cursor: pointer;
  }
  .place-menu-btn:hover { background: var(--bg); }
  .vote-row { display: flex; gap: 8px; margin-top: 8px; }
  .vote-btn {
    display: flex; align-items: center; gap: 4px; padding: 4px 10px;
    border-radius: 20px; font-size: 13px; border: 1px solid var(--border);
    background: none; cursor: pointer; transition: background .15s;
  }
  .vote-btn.liked { background: #fff0f0; border-color: #ffb3b3; color: #e53935; }
  .vote-btn.disliked { background: #eef1ff; border-color: #b3bfff; color: var(--primary); }
  .add-place-btn {
    width: 100%; padding: 10px; border: 1px dashed var(--border); border-radius: 10px;
    background: none; cursor: pointer; font-size: 14px; color: var(--muted);
    transition: border-color .15s, color .15s;
  }
  .add-place-btn:hover { border-color: var(--primary); color: var(--primary); }

  /* ── Votes tab ── */
  .vote-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
  .vote-card-title { font-weight: 700; font-size: 15px; margin-bottom: 10px; }
  .vote-option {
    display: flex; align-items: center; gap: 10px; padding: 8px 0;
    border-bottom: 1px solid var(--border); cursor: pointer;
  }
  .vote-option:last-child { border-bottom: none; }
  .vote-option-text { flex: 1; font-size: 14px; }
  .vote-bar-wrap { flex: 1; position: relative; height: 6px; background: var(--bg); border-radius: 3px; }
  .vote-bar { height: 100%; border-radius: 3px; background: var(--primary); transition: width .3s; }
  .vote-count { font-size: 13px; color: var(--muted); min-width: 20px; text-align: right; }
  .vote-my-mark { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); flex-shrink: 0; }
  .vote-status { font-size: 12px; color: var(--muted); margin-top: 8px; display: flex; justify-content: space-between; align-items: center; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .badge-active { background: #e6f4ea; color: #2e7d32; }
  .badge-closed { background: #f5f5f5; color: #888; }

  /* ── Budget tab ── */
  .budget-summary { background: var(--primary); color: #fff; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .budget-summary .total { font-size: 28px; font-weight: 700; margin-top: 4px; }
  .budget-summary .per-person { font-size: 14px; opacity: .85; margin-top: 6px; }
  .expense-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; }
  .expense-info { flex: 1; }
  .expense-desc { font-weight: 600; font-size: 15px; }
  .expense-by { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .expense-amount { font-weight: 700; font-size: 16px; color: var(--primary); }
  .settlement-table { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-top: 16px; }
  .settlement-table table { width: 100%; border-collapse: collapse; }
  .settlement-table th, .settlement-table td { padding: 10px 14px; font-size: 13px; border-bottom: 1px solid var(--border); text-align: left; }
  .settlement-table th { background: var(--bg); font-weight: 600; color: var(--muted); }
  .settlement-table tr:last-child td { border-bottom: none; }

  /* ── Threads tab ── */
  #panel-chat {
    width: 100%; height: 100%; min-height: 0; max-width: 600px; flex-direction: column;
  }
  .thread-list-view, .thread-detail-view {
    flex: 1; min-height: 0; display: flex; flex-direction: column;
  }
  .thread-list { overflow-y: auto; padding-bottom: 8px; }
  .thread-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px; margin-bottom: 12px; cursor: pointer;
  }
  .swipe-item .thread-card {
    position: relative; z-index: 1; margin-bottom: 0; transition: transform .18s ease;
  }
  .swipe-item.open .thread-card { transform: translateX(-128px); }
  .thread-card:hover { border-color: var(--primary); }
  .thread-info { min-width: 0; }
  .thread-title-row { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .thread-title {
    font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .thread-new-badge {
    flex-shrink: 0; padding: 2px 6px; border-radius: 999px;
    background: #fff0f0; color: #e53935; font-size: 10px; font-weight: 800; line-height: 1.2;
  }
  .thread-private-badge {
    flex-shrink: 0; padding: 2px 7px; border-radius: 999px;
    background: var(--bg); color: var(--muted); border: 1px solid var(--border);
    font-size: 10px; font-weight: 700; line-height: 1.2;
  }
  .thread-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .thread-action-btn {
    border: 1px solid var(--border); background: var(--card); color: var(--muted);
    border-radius: 8px; padding: 6px 9px; font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .thread-action-btn:hover { border-color: var(--primary); color: var(--primary); }
  .thread-action-btn.danger:hover { border-color: var(--danger); color: var(--danger); }
  .thread-detail-header {
    display: flex; align-items: center; gap: 8px; flex-shrink: 0;
    padding-bottom: 10px; border-bottom: 1px solid var(--border);
  }
  .thread-back-btn {
    width: 34px; height: 34px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--card); color: var(--text); font-size: 18px; cursor: pointer; flex-shrink: 0;
  }
  .thread-detail-title {
    flex: 1; min-width: 0; font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .thread-messages {
    flex: 1; min-height: 0; overflow-y: auto; padding: 8px 0;
  }
  .thread-message-stack { display: flex; flex-direction: column; }
  .thread-post {
    display: flex; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--border);
  }
  .thread-post:last-child { border-bottom: none; }
  .msg-avatar {
    width: 32px; height: 32px; border-radius: 50%; background: var(--primary);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; flex-shrink: 0; overflow: hidden; margin-top: 2px;
  }
  .msg-avatar img { width: 32px; height: 32px; object-fit: cover; display: block; }
  .thread-post-body { flex: 1; min-width: 0; }
  .thread-post-meta { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
  .thread-post-name { font-size: 14px; font-weight: 700; }
  .thread-post-time { font-size: 12px; color: var(--muted); }
  .thread-post-text { font-size: 15px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
  .thread-reply-btn {
    width: 100%; margin-top: 12px; flex-shrink: 0;
  }

  /* ── Modal ── */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 100;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .modal-overlay.hidden { display: none; }
  .modal {
    background: var(--card); border-radius: 16px 16px 0 0; padding: 20px 20px 32px;
    width: 100%; max-width: 480px; max-height: 85vh; overflow-y: auto;
  }
  .modal h3 { font-size: 17px; font-weight: 700; margin-bottom: 16px; }

  /* Members sheet */
  .member-chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px;
    background: var(--bg); border-radius: 20px; font-size: 13px; margin: 4px;
  }
  .icon-btn-sm {
    background: none; border: none; cursor: pointer; font-size: 14px;
    padding: 2px 4px; border-radius: 4px; line-height: 1;
  }
  .icon-btn-sm:hover { background: var(--border); }

  /* Toast */
  #toast {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(10px);
    background: #1a1d2e; color: #fff; padding: 10px 18px; border-radius: 8px;
    font-size: 14px; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 200;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Empty state */
  .empty { text-align: center; padding: 40px 16px; color: var(--muted); font-size: 14px; }
  .empty-icon { font-size: 40px; margin-bottom: 12px; }

  /* Loading */
  .spinner { width: 24px; height: 24px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin .7s linear infinite; margin: 40px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- Auth Screen -->
<div id="auth-screen">
  <div style="font-size:48px">✈️</div>
  <h1>여행 플래너</h1>
  <p>친구들과 함께 여행 일정을 만들어보세요</p>
  <button class="btn-google" id="google-login-btn">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
    Google로 로그인
  </button>
</div>

<!-- Trip Select Screen -->
<div id="trip-screen">
  <h2>내 여행</h2>
  <div class="trip-list" id="trip-list">
    <div class="spinner"></div>
  </div>
  <div class="divider">또는</div>
  <div style="margin-bottom:20px">
    <div class="form-group"><label>여행 코드로 참가</label></div>
    <div class="join-row">
      <input type="text" id="join-code-input" placeholder="여행 코드 입력 (6자리)" maxlength="6" style="text-transform:uppercase">
      <button class="btn btn-outline" id="join-btn">참가</button>
    </div>
  </div>
  <div class="divider">새 여행</div>
  <div class="form-group"><label>여행 이름</label><input type="text" id="new-trip-name" placeholder="예: 오사카 4박5일"></div>
  <div class="form-group"><label>출발일</label><input type="date" id="new-trip-start"></div>
  <div class="form-group"><label>귀국일</label><input type="date" id="new-trip-end"></div>
  <button class="btn btn-primary" id="create-trip-btn">여행 만들기</button>
</div>

<!-- App Shell -->
<div id="app">
  <div id="app-header">
    <button class="icon-btn" id="back-btn" title="여행 목록">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div style="flex:1; min-width:0;">
      <div id="trip-title">로딩중...</div>
      <div id="trip-dates"></div>
    </div>
    <button class="icon-btn" id="share-btn" title="여행 코드 공유">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
    </button>
    <button class="icon-btn" id="members-btn" title="멤버">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
    </button>
  </div>

  <nav id="tab-nav">
    <button class="tab-btn active" data-tab="itinerary">📅 일정</button>
    <button class="tab-btn" data-tab="votes">🗳️ 투표</button>
    <button class="tab-btn" data-tab="budget">💰 예산</button>
    <button class="tab-btn" data-tab="chat">💬 스레드</button>
  </nav>

  <div id="tab-content">
    <!-- Itinerary -->
    <div class="tab-panel active" id="panel-itinerary">
      <div id="itinerary-days"></div>
    </div>

    <!-- Votes -->
    <div class="tab-panel" id="panel-votes">
      <button class="btn btn-primary" id="create-vote-btn" style="margin-bottom:16px">+ 새 투표 만들기</button>
      <div id="votes-list"></div>
    </div>

    <!-- Budget -->
    <div class="tab-panel" id="panel-budget">
      <div class="budget-summary">
        <div style="font-size:13px;opacity:.85">총 지출</div>
        <div class="total" id="budget-total">₩0</div>
        <div class="per-person" id="budget-per-person"></div>
      </div>
      <button class="btn btn-primary" id="add-expense-btn" style="margin-bottom:16px">+ 지출 추가</button>
      <div id="expense-list"></div>
      <div class="settlement-table" id="settlement-section" style="display:none">
        <table>
          <thead><tr><th>멤버</th><th>낸 금액</th><th>정산액</th><th>상태</th></tr></thead>
          <tbody id="settlement-tbody"></tbody>
        </table>
      </div>
    </div>

    <!-- Threads -->
    <div class="tab-panel" id="panel-chat" style="display:none">
      <div class="thread-list-view" id="thread-list-view">
        <button class="btn btn-primary" id="new-thread-btn" style="margin-bottom:16px">+ 새 스레드 만들기</button>
        <div class="thread-list" id="thread-list"></div>
      </div>
      <div class="thread-detail-view" id="thread-detail-view" style="display:none">
        <div class="thread-detail-header">
          <button class="thread-back-btn" id="thread-back-btn" type="button" aria-label="스레드 목록">‹</button>
          <div class="thread-detail-title" id="thread-detail-title"></div>
          <div class="thread-actions" id="thread-detail-actions"></div>
        </div>
        <div class="thread-messages" id="thread-messages">
          <div class="thread-message-stack" id="thread-message-stack"></div>
        </div>
        <button class="btn btn-primary thread-reply-btn" id="thread-reply-btn">+ 답글 추가</button>
      </div>
    </div>
  </div>
</div>

<!-- Modals -->
<div class="modal-overlay hidden" id="modal-overlay">
  <div class="modal" id="modal-content"></div>
</div>

<!-- Members Sheet -->
<div class="modal-overlay hidden" id="members-overlay">
  <div class="modal">
    <h3>여행 멤버</h3>
    <div id="members-list"></div>
    <button class="btn btn-outline" style="margin-top:16px;width:100%" onclick="closeMembersSheet()">닫기</button>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

<script>

// ── Util ──
function toast(msg, dur = 2500) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), dur);
}

function fmt(date) {
  if (!date) return '';
  const d = date.toDate ? date.toDate() : new Date(date);
  return d.toLocaleDateString('ko-KR', { month: 'short', day: 'numeric', weekday: 'short' });
}

function fmtTime(date) {
  if (!date) return '';
  const d = date.toDate ? date.toDate() : new Date(date);
  return d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
}

function fmtDateTime(date) {
  if (!date) return '방금 전';
  return `${fmt(date)} ${fmtTime(date)}`;
}

function tsMillis(date) {
  if (!date) return 0;
  if (date.toMillis) return date.toMillis();
  return new Date(date).getTime() || 0;
}

function genCode() {
  return Math.random().toString(36).substring(2, 8).toUpperCase();
}

function initials(name) {
  if (!name) return '?';
  return name.trim().charAt(0).toUpperCase();
}

function avatarEl(name, photoURL, size = 32) {
  const wrap = document.createElement('div');
  wrap.style.cssText = `width:${size}px;height:${size}px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:${Math.round(size*0.4)}px;font-weight:700;flex-shrink:0;overflow:hidden`;
  if (photoURL) {
    const img = document.createElement('img');
    img.src = photoURL;
    img.style.cssText = `width:${size}px;height:${size}px;object-fit:cover;display:block`;
    img.alt = name;
    img.onerror = () => { img.remove(); wrap.textContent = initials(name); };
    wrap.appendChild(img);
  } else {
    wrap.textContent = initials(name);
  }
  return wrap;
}

async function upsertUserProfile(user) {
  if (!user) return;
  await db.doc(`userProfiles/${user.uid}`).set({
    name: user.displayName || '익명',
    photoURL: user.photoURL || null
  }, { merge: true });
}

async function getUserProfiles(uids) {
  const profiles = {};
  await Promise.all(uids.map(async uid => {
    const snap = await db.doc(`userProfiles/${uid}`).get();
    profiles[uid] = snap.exists ? snap.data() : { name: '멤버', photoURL: null };
  }));
  return profiles;
}

async function ensureTripCode(tripId, trip) {
  if (!trip?.code) return;
  try {
    const codeRef = db.doc(`tripCodes/${trip.code}`);
    const snap = await codeRef.get();
    if (!snap.exists) {
      await codeRef.set({
        tripId,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }
  } catch(e) {
    console.warn('여행 코드 동기화 실패:', e);
  }
}

function formatKRW(n) {
  return '₩' + Number(n).toLocaleString('ko-KR');
}

function dateRange(start, end) {
  const dates = [];
  const s = new Date(start), e = new Date(end);
  for (let d = new Date(s); d <= e; d.setDate(d.getDate() + 1)) {
    dates.push(new Date(d).toISOString().split('T')[0]);
  }
  return dates;
}

function dateLabel(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' });
}

async function loadMyTrips() {
  const listEl = document.getElementById('trip-list');
  listEl.innerHTML = '<div class="spinner"></div>';
  try {
    const snap = await db.collection('trips')
      .where('memberUids', 'array-contains', currentUser.uid).get();
    if (snap.empty) {
      listEl.innerHTML = '<div class="empty">아직 참가한 여행이 없어요</div>';
      return;
    }
    listEl.innerHTML = '';
    const docs = snap.docs.sort((a, b) => {
      const ta = a.data().createdAt?.toMillis?.() || 0;
      const tb = b.data().createdAt?.toMillis?.() || 0;
      return tb - ta;
    });
    docs.forEach(doc => {
      const t = doc.data();
      ensureTripCode(doc.id, t);
      const el = document.createElement('div');
      el.className = 'trip-card';
      el.innerHTML = `<div class="tc-name">${t.name}</div><div class="tc-date">${t.startDate} ~ ${t.endDate} · 멤버 ${Object.keys(t.members || {}).length}명</div>`;
      el.onclick = () => openTrip(doc.id, t);
      listEl.appendChild(el);
    });
  } catch(e) {
    listEl.innerHTML = '<div class="empty">불러오기 실패: ' + e.message + '</div>';
  }
}

document.getElementById('create-trip-btn').onclick = async () => {
  const name = document.getElementById('new-trip-name').value.trim();
  const start = document.getElementById('new-trip-start').value;
  const end = document.getElementById('new-trip-end').value;
  if (!name || !start || !end) { toast('여행 이름과 날짜를 입력해주세요'); return; }
  if (start > end) { toast('귀국일이 출발일보다 빠를 수 없어요'); return; }
  const btn = document.getElementById('create-trip-btn');
  btn.disabled = true;
  try {
    const code = genCode();
    const members = { [currentUser.uid]: currentUser.displayName || '익명' };
    const tripRef = db.collection('trips').doc();
    const batch = db.batch();
    const tripData = {
      name, startDate: start, endDate: end,
      code, members,
      memberUids: [currentUser.uid],
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    batch.set(tripRef, tripData);
    batch.set(db.doc(`tripCodes/${code}`), {
      tripId: tripRef.id,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    await batch.commit();
    toast('여행이 만들어졌어요!');
    openTrip(tripRef.id, tripData);
  } catch(e) { toast('실패: ' + e.message); }
  finally { btn.disabled = false; }
};

function canvasToBlob(canvas, quality) {
  return new Promise((resolve, reject) => {
    canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('압축 실패')), 'image/jpeg', quality);
  });
}

function loadImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      resolve(img);
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error('이미지를 불러오지 못했어요'));
    };
    img.src = url;
  });
}

async function compressImage(file, targetBytes = PROFILE_PHOTO_MAX_BYTES) {
  const img = await loadImage(file);
  let maxPx = Math.min(1024, Math.max(img.width, img.height));
  const qualities = [0.85, 0.75, 0.65, 0.55, 0.45];

  for (let attempt = 0; attempt < 6; attempt++) {
    const scale = Math.min(1, maxPx / Math.max(img.width, img.height));
    const w = Math.max(1, Math.round(img.width * scale));
    const h = Math.max(1, Math.round(img.height * scale));
    const canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    canvas.getContext('2d').drawImage(img, 0, 0, w, h);

    for (const quality of qualities) {
      const blob = await canvasToBlob(canvas, quality);
      if (blob.size < targetBytes) return blob;
    }

    maxPx = Math.round(maxPx * 0.75);
  }

  throw new Error('이미지를 2MB 이하로 압축하지 못했어요. 더 작은 이미지를 선택해주세요');
}

async function uploadProfilePhoto(file) {
  document.getElementById('m-upload-status').textContent = '압축 중...';
  const compressed = await compressImage(file);
  document.getElementById('m-upload-status').textContent = '업로드 중...';
  const ref = storage.ref(`profile-photos/${currentUser.uid}/avatar`);
  const snapshot = await ref.put(compressed, { contentType: 'image/jpeg' });
  const downloadURL = await snapshot.ref.getDownloadURL();
  await auth.currentUser.updateProfile({ photoURL: downloadURL });
  currentUser = auth.currentUser;
  await db.doc(`userProfiles/${currentUser.uid}`).set({ photoURL: downloadURL }, { merge: true });
}

async function updateDisplayName(newName) {
  await auth.currentUser.updateProfile({ displayName: newName });
  currentUser = auth.currentUser;

  const snap = await db.collection('trips')
    .where('memberUids', 'array-contains', currentUser.uid).get();
  const batch = db.batch();
  snap.forEach(doc => {
    batch.update(doc.ref, { [`members.${currentUser.uid}`]: newName });
  });
  await batch.commit();

  await db.doc(`userProfiles/${currentUser.uid}`).set({ name: newName }, { merge: true });

  if (currentTrip) currentTrip.members[currentUser.uid] = newName;
  finishProfileSave();
}

function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.tab-panel').forEach(p => {
    p.classList.remove('active');
    p.style.display = '';
  });
  const panel = document.getElementById('panel-' + tab);
  panel.classList.add('active');

  stopThreadMessageListener();

  // Threads need flex
  if (tab === 'chat') {
    panel.style.display = 'flex';
    panel.style.flexDirection = 'column';
    showThreadList();
    loadThreads();
  } else if (tab === 'itinerary') {
    loadItinerary();
  } else if (tab === 'votes') {
    loadVotes();
  } else if (tab === 'budget') {
    loadBudget();
  }
}

// ── Itinerary ──
function loadItinerary() {
  const container = document.getElementById('itinerary-days');
  container.innerHTML = '<div class="spinner"></div>';
  const unsub = db.collection(`trips/${currentTripId}/places`)
    .orderBy('createdAt').onSnapshot(snap => {
      const places = {};
      snap.forEach(doc => {
        const p = { id: doc.id, ...doc.data() };
        if (!places[p.date]) places[p.date] = [];
        places[p.date].push(p);
      });
      renderItinerary(places);
    }, e => { container.innerHTML = '<div class="empty">오류: ' + e.message + '</div>'; });
  unsubscribers.push(unsub);
}

function renderItinerary(places) {
  const container = document.getElementById('itinerary-days');
  const dates = dateRange(currentTrip.startDate, currentTrip.endDate);
  if (!dates.length) { container.innerHTML = '<div class="empty">날짜 정보가 없어요</div>'; return; }
  container.innerHTML = '';
  dates.forEach((date, i) => {
    const dayPlaces = places[date] || [];
    const block = document.createElement('div');
    block.className = 'day-block';
    block.innerHTML = `<div class="day-header"><span>Day ${i + 1} · ${dateLabel(date)}</span></div>`;
    dayPlaces.forEach(p => {
      block.appendChild(makePlaceCard(p));
    });
    const addBtn = document.createElement('button');
    addBtn.className = 'add-place-btn';
    addBtn.textContent = '+ 일정 추가';
    addBtn.onclick = () => openAddPlaceModal(date);
    block.appendChild(addBtn);
    container.appendChild(block);
  });
}

function makePlaceCard(p) {
  const uid = currentUser.uid;
  const likes = Object.keys(p.likes || {}).length;
  const dislikes = Object.keys(p.dislikes || {}).length;
  const iLiked = (p.likes || {})[uid];
  const iDisliked = (p.dislikes || {})[uid];
  const canManage = p.addedByUid === uid;

  const card = document.createElement('div');
  card.className = 'place-card';
  card.innerHTML = `
    <div class="place-info">
      <div class="place-name">${esc(p.name)}</div>
      <div class="place-meta">${p.time ? p.time + ' · ' : ''}작성자: ${esc(p.addedBy)}</div>
      ${p.note ? `<div class="place-note">${esc(p.note)}</div>` : ''}
      <div class="vote-row">
        <button class="vote-btn ${iLiked ? 'liked' : ''}" data-id="${p.id}" data-action="like">👍 ${likes}</button>
        <button class="vote-btn ${iDisliked ? 'disliked' : ''}" data-id="${p.id}" data-action="dislike">👎 ${dislikes}</button>
      </div>
    </div>
    ${canManage ? '<button class="place-menu-btn" type="button" title="수정/삭제" aria-label="수정/삭제">⋯</button>' : ''}`;
  bindPlaceCardActions(card, p);

  if (!canManage) return card;

  const item = document.createElement('div');
  item.className = 'swipe-item';
  item.innerHTML = `
    <div class="place-actions">
      <button class="place-action edit" type="button">수정</button>
      <button class="place-action delete" type="button">삭제</button>
    </div>`;
  item.appendChild(card);
  bindSwipeActions(item);
  item.querySelector('.place-action.edit').onclick = () => openEditPlaceModal(p);
  item.querySelector('.place-action.delete').onclick = () => deletePlace(p.id);
  card.querySelector('.place-menu-btn').onclick = () => toggleSwipeItem(item);
  return item;
}

function bindPlaceCardActions(card, p) {
  card.querySelectorAll('.vote-btn').forEach(btn => {
    btn.onclick = () => votePlace(p.id, btn.dataset.action);
  });
}

function toggleSwipeItem(item, forceOpen) {
  document.querySelectorAll('.swipe-item.open').forEach(openItem => {
    if (openItem !== item) openItem.classList.remove('open');
  });
  item.classList.toggle('open', forceOpen ?? !item.classList.contains('open'));
}

function bindSwipeActions(item) {
  const content = item.querySelector('.place-card, .thread-card');
  if (!content) return;
  let startX = 0, startY = 0, deltaX = 0, dragging = false, horizontal = false;

  content.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    startX = e.clientX;
    startY = e.clientY;
    deltaX = item.classList.contains('open') ? -128 : 0;
    dragging = true;
    horizontal = false;
    content.setPointerCapture(e.pointerId);
  });

  content.addEventListener('pointermove', e => {
    if (!dragging) return;
    const moveX = e.clientX - startX;
    const moveY = e.clientY - startY;
    if (!horizontal && Math.abs(moveY) > Math.abs(moveX)) return;
    horizontal = true;
    const base = item.classList.contains('open') ? -128 : 0;
    deltaX = Math.max(-128, Math.min(0, base + moveX));
    content.style.transform = `translateX(${deltaX}px)`;
  });

  content.addEventListener('pointerup', () => {
    if (!dragging) return;
    dragging = false;
    content.style.transform = '';
    toggleSwipeItem(item, deltaX < -64);
  });

  content.addEventListener('pointercancel', () => {
    dragging = false;
    content.style.transform = '';
  });
}

function esc(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function escAttr(str) {
  return esc(str).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

async function votePlace(placeId, action) {
  const uid = currentUser.uid;
  const ref = db.doc(`trips/${currentTripId}/places/${placeId}`);
  const snap = await ref.get();
  const data = snap.data();
  const likedByMe = (data.likes || {})[uid];
  const dislikedByMe = (data.dislikes || {})[uid];

  const update = {};
  if (action === 'like') {
    update[`likes.${uid}`] = likedByMe ? firebase.firestore.FieldValue.delete() : true;
    if (!likedByMe && dislikedByMe) update[`dislikes.${uid}`] = firebase.firestore.FieldValue.delete();
  } else {
    update[`dislikes.${uid}`] = dislikedByMe ? firebase.firestore.FieldValue.delete() : true;
    if (!dislikedByMe && likedByMe) update[`likes.${uid}`] = firebase.firestore.FieldValue.delete();
  }
  await ref.update(update);
}

function makeVoteCard(id, v) {
  const uid = currentUser.uid;
  const totalVoters = new Set(v.options.flatMap(o => Object.keys(o.votes || {}))).size;
  const maxVotes = Math.max(...v.options.map(o => Object.keys(o.votes || {}).length), 1);
  const isClosed = v.status === 'closed';

  const card = document.createElement('div');
  card.className = 'vote-card';
  const optionsHtml = v.options.map((opt, i) => {
    const count = Object.keys(opt.votes || {}).length;
    const pct = maxVotes > 0 ? Math.round(count / maxVotes * 100) : 0;
    const voted = (opt.votes || {})[uid];
    return `<div class="vote-option ${isClosed ? '' : 'clickable'}" data-vote-id="${id}" data-opt-idx="${i}" style="cursor:${isClosed?'default':'pointer'}">
      ${voted ? '<div class="vote-my-mark"></div>' : '<div style="width:8px"></div>'}
      <div class="vote-option-text">${esc(opt.text)}</div>
      <div class="vote-bar-wrap"><div class="vote-bar" style="width:${pct}%"></div></div>
      <div class="vote-count">${count}</div>
    </div>`;
  }).join('');

  card.innerHTML = `
    <div class="vote-card-title">${esc(v.title)}</div>
    ${optionsHtml}
    <div class="vote-status">
      <span class="badge ${isClosed ? 'badge-closed' : 'badge-active'}">${isClosed ? '마감' : '진행중'}</span>
      <span>${totalVoters}명 참여</span>
      ${!isClosed && v.createdByUid === uid ? `<button class="btn btn-sm btn-outline" data-close-vote="${id}">투표 마감</button>` : ''}
    </div>`;

  if (!isClosed) {
    card.querySelectorAll('.vote-option').forEach(el => {
      el.onclick = () => castVote(id, v, parseInt(el.dataset.optIdx));
    });
  }
  const closeBtn = card.querySelector('[data-close-vote]');
  if (closeBtn) closeBtn.onclick = () => closeVote(id);
  return card;
}

async function castVote(voteId, voteData, optIdx) {
  const uid = currentUser.uid;
  const options = voteData.options.map((o, i) => {
    const votes = { ...(o.votes || {}) };
    delete votes[uid];
    if (i === optIdx) votes[uid] = true;
    return { ...o, votes };
  });
  await db.doc(`trips/${currentTripId}/votes/${voteId}`).update({ options });
}

async function closeVote(voteId) {
  await db.doc(`trips/${currentTripId}/votes/${voteId}`).update({ status: 'closed' });
}

function loadBudget() {
  const listEl = document.getElementById('expense-list');
  listEl.innerHTML = '<div class="spinner"></div>';
  const unsub = db.collection(`trips/${currentTripId}/expenses`)
    .orderBy('createdAt', 'desc').onSnapshot(snap => {
      const expenses = [];
      snap.forEach(doc => expenses.push({ id: doc.id, ...doc.data() }));
      renderBudget(expenses);
    }, e => { listEl.innerHTML = '<div class="empty">오류: ' + e.message + '</div>'; });
  unsubscribers.push(unsub);
}

function renderBudget(expenses) {
  const listEl = document.getElementById('expense-list');
  const total = expenses.reduce((s, e) => s + (e.amount || 0), 0);
  const members = currentTrip?.members || {};
  const memberCount = Object.keys(members).length || 1;
  const perPerson = Math.ceil(total / memberCount);

  document.getElementById('budget-total').textContent = formatKRW(total);
  document.getElementById('budget-per-person').textContent = `1인당 ${formatKRW(perPerson)} (${memberCount}명 기준)`;

  if (!expenses.length) {
    listEl.innerHTML = '<div class="empty"><div class="empty-icon">💸</div>아직 지출이 없어요</div>';
    document.getElementById('settlement-section').style.display = 'none';
    return;
  }

  listEl.innerHTML = expenses.map(e => `
    <div class="expense-card">
      <div class="expense-info">
        <div class="expense-desc">${esc(e.description)}</div>
        <div class="expense-by">${esc(e.paidBy)} 결제</div>
      </div>
      <div class="expense-amount">${formatKRW(e.amount)}</div>
    </div>
  `).join('');

  // Settlement: who paid how much vs share
  const paidMap = {};
  expenses.forEach(e => {
    paidMap[e.paidBy] = (paidMap[e.paidBy] || 0) + (e.amount || 0);
  });
  const tbody = document.getElementById('settlement-tbody');
  tbody.innerHTML = Object.entries(paidMap).map(([name, paid]) => {
    const diff = paid - perPerson;
    const status = diff > 0 ? `+${formatKRW(diff)} 받아야함` : diff < 0 ? `${formatKRW(Math.abs(diff))} 줘야함` : '정산 완료';
    return `<tr><td>${esc(name)}</td><td>${formatKRW(paid)}</td><td>${formatKRW(perPerson)}</td><td style="color:${diff>0?'var(--success)':diff<0?'var(--danger)':'var(--muted)'}">${status}</td></tr>`;
  }).join('');
  document.getElementById('settlement-section').style.display = 'block';
}

// ── Threads ──
function stopThreadMessageListener() {
  if (threadMessagesUnsub) {
    threadMessagesUnsub();
    threadMessagesUnsub = null;
  }
}

function stopThreadListeners() {
  threadUnsubs.forEach(unsub => unsub());
  threadUnsubs = [];
  threadQueryState = { public: [], private: [] };
  threadRenderSeq++;
  stopThreadMessageListener();
  activeThreadId = null;
  activeThreadData = null;
}

function loadThreads() {
  const listEl = document.getElementById('thread-list');
  if (threadUnsubs.length && listEl.dataset.loaded === currentTripId) return;
  threadUnsubs.forEach(unsub => unsub());
  threadUnsubs = [];
  threadQueryState = { public: [], private: [] };
  listEl.dataset.loaded = currentTripId;
  listEl.innerHTML = '<div class="spinner"></div>';

  const base = db.collection(`trips/${currentTripId}/threads`);
  const queries = [
    ['public', base.where('deleted', '==', false).where('visibility', '==', 'public')],
    ['private', base.where('deleted', '==', false).where('visibility', '==', 'private').where('createdByUid', '==', currentUser.uid)]
  ];

  queries.forEach(([key, query]) => {
    const unsub = query.onSnapshot(snap => {
      threadQueryState[key] = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      renderMergedThreads();
    }, e => { listEl.innerHTML = '<div class="empty">오류: ' + e.message + '</div>'; });
    threadUnsubs.push(unsub);
  });
}

async function renderMergedThreads() {
  const byId = {};
  [...threadQueryState.public, ...threadQueryState.private].forEach(thread => {
    byId[thread.id] = thread;
  });
  const threads = Object.values(byId).sort((a, b) => tsMillis(b.updatedAt) - tsMillis(a.updatedAt));
  const seq = ++threadRenderSeq;
  const enriched = await Promise.all(threads.map(async thread => {
    const readAt = await getThreadReadAt(thread.id);
    return { ...thread, readAt, isNew: isThreadNew(thread, readAt) };
  }));
  if (seq !== threadRenderSeq) return;
  renderThreads(enriched);
}

async function getThreadReadAt(threadId) {
  try {
    const snap = await db.doc(`trips/${currentTripId}/threads/${threadId}/reads/${currentUser.uid}`).get();
    return snap.exists ? snap.data().readAt : null;
  } catch(e) {
    console.warn('스레드 읽음 상태 불러오기 실패:', e);
    return null;
  }
}

function isThreadNew(thread, readAt) {
  const updated = tsMillis(thread.updatedAt);
  if (!updated) return false;
  return updated > tsMillis(readAt);
}

function renderThreads(threads) {
  const listEl = document.getElementById('thread-list');
  if (!threads.length) {
    listEl.innerHTML = '<div class="empty"><div class="empty-icon">💬</div>아직 스레드가 없어요</div>';
    if (activeThreadId) showThreadList();
    return;
  }

  if (activeThreadId && !threads.some(t => t.id === activeThreadId)) {
    showThreadList();
  }

  listEl.innerHTML = '';
  threads.forEach(thread => listEl.appendChild(makeThreadCard(thread)));
}

function makeThreadCard(thread) {
  const canManage = thread.createdByUid === currentUser.uid;
  const card = document.createElement('div');
  card.className = 'thread-card';
  card.innerHTML = `
    <div class="thread-info">
      <div class="thread-title-row">
        ${thread.isNew ? '<span class="thread-new-badge">NEW</span>' : ''}
        <div class="thread-title">${esc(thread.title)}</div>
        ${thread.visibility === 'private' ? '<span class="thread-private-badge">🔒 나만</span>' : ''}
      </div>
    </div>
  `;

  card.onclick = () => openThread(thread.id, thread);
  if (!canManage) return card;

  const item = document.createElement('div');
  item.className = 'swipe-item';
  item.innerHTML = `
    <div class="place-actions">
      <button class="place-action edit" type="button">수정</button>
      <button class="place-action delete" type="button">삭제</button>
    </div>`;
  item.appendChild(card);
  bindSwipeActions(item);
  item.querySelector('.place-action.edit').onclick = () => openEditThreadModal(thread);
  item.querySelector('.place-action.delete').onclick = () => deleteThread(thread);
  return item;
}

function showThreadList() {
  stopThreadMessageListener();
  activeThreadId = null;
  activeThreadData = null;
  document.getElementById('thread-list-view').style.display = 'flex';
  document.getElementById('thread-detail-view').style.display = 'none';
  renderMergedThreads();
}

function openThread(threadId, thread) {
  activeThreadId = threadId;

  document.getElementById('thread-detail-view').style.display = 'flex';
  document.getElementById('thread-detail-title').textContent = thread.title || '스레드';
  renderThreadDetailActions(thread);
  markThreadRead(threadId);
  loadThreadMessages(threadId);
}

function renderThreadDetailActions(thread) {
  const actions = document.getElementById('thread-detail-actions');
  actions.innerHTML = '';
}

function loadThreadMessages(threadId) {
  stopThreadMessageListener();
  const stack = document.getElementById('thread-message-stack');
  stack.innerHTML = '<div class="empty">메시지가 아직 없어요</div>';

  threadMessagesUnsub = db.collection(`trips/${currentTripId}/threads/${threadId}/messages`)
    .orderBy('createdAt')
    .limitToLast(100)
    .onSnapshot(snap => {
      stack.innerHTML = '';
      if (snap.empty) {
        stack.innerHTML = '<div class="empty">메시지가 아직 없어요</div>';
      } else {
        snap.forEach(doc => stack.appendChild(makeMsgEl(doc.data())));
      }
    }, e => { stack.innerHTML = '<div class="empty">오류: ' + e.message + '</div>'; });
}

async function markThreadRead(threadId) {
  try {
    await db.doc(`trips/${currentTripId}/threads/${threadId}/reads/${currentUser.uid}`).set({
      uid: currentUser.uid,
      readAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
    updateThreadReadState(threadId, new Date());
  } catch(e) {
    console.warn('스레드 읽음 처리 실패:', e);
  }
}

function updateThreadReadState(threadId, readAt) {
  ['public', 'private'].forEach(key => {
    threadQueryState[key] = threadQueryState[key].map(thread => (
      thread.id === threadId ? { ...thread, readAt } : thread
    ));
  });
}

function makeMsgEl(msg) {
  const div = document.createElement('div');
  div.className = 'thread-post';

    const img = document.createElement('img');
    img.src = msg.photoURL;
    img.alt = msg.displayName || '';
    img.onerror = () => { img.remove(); avatar.textContent = initials(msg.displayName); };
    avatar.appendChild(img);
  } else {
    avatar.textContent = initials(msg.displayName);
  }

  const body = document.createElement('div');
  body.className = 'thread-post-body';
  body.innerHTML = `
    <div class="thread-post-meta">
      <span class="thread-post-name">${esc(msg.displayName)}</span>
      <span class="thread-post-time">${time}</span>
    </div>
    <div class="thread-post-text">${esc(msg.text)}</div>`;

  div.appendChild(avatar);
  div.appendChild(body);
  return div;
}

async function updateThreadTitle(threadId) {
  const input = document.getElementById('m-thread-title');
  const title = input.value.trim();
  if (!title) { toast('주제명을 입력해주세요'); return; }
  const btn = document.getElementById('m-save-thread');
  btn.disabled = true;
  try {
    await db.doc(`trips/${currentTripId}/threads/${threadId}`).update({
      title,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    closeModal();
    if (activeThreadId === threadId) {
      activeThreadData = { ...activeThreadData, title };
      document.getElementById('thread-detail-title').textContent = title;
    }
    toast('스레드가 수정됐어요');
  } catch(e) {
    toast('수정 실패: ' + e.message);
    btn.disabled = false;
  }
}

async function deleteThread(thread) {
  if (!confirm(`'${thread.title}' 스레드를 삭제할까요?`)) return;
  try {
    await db.doc(`trips/${currentTripId}/threads/${thread.id}`).update({
      deleted: true,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    if (activeThreadId === thread.id) showThreadList();
    toast('스레드가 삭제됐어요');
  } catch(e) {
    toast('삭제 실패: ' + e.message);
  }
}

function openThreadReplyModal() {
  if (!activeThreadId) return;
  openModal(`
    <h3>답글 추가</h3>
    <div class="form-group"><label>내용 *</label><textarea id="m-thread-reply" rows="5" maxlength="500" placeholder="답글을 입력하세요"></textarea></div>
    <button class="btn btn-primary" id="m-send-thread-reply">등록하기</button>
  `);
  document.getElementById('m-send-thread-reply').onclick = sendThreadMessage;
}

async function sendThreadMessage() {
  const input = document.getElementById('m-thread-reply');
  const text = input.value.trim();
  if (!text || !currentTripId || !activeThreadId) return;
  const btn = document.getElementById('m-send-thread-reply');
  btn.disabled = true;
  try {
    const batch = db.batch();
    const msgRef = db.collection(`trips/${currentTripId}/threads/${activeThreadId}/messages`).doc();
    const threadRef = db.doc(`trips/${currentTripId}/threads/${activeThreadId}`);
    batch.set(msgRef, {
      text,
      uid: currentUser.uid,
      displayName: currentUser.displayName || '익명',
      photoURL: currentUser.photoURL || null,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    batch.update(threadRef, {
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    batch.set(db.doc(`trips/${currentTripId}/threads/${activeThreadId}/reads/${currentUser.uid}`), {
      uid: currentUser.uid,
      readAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
    await batch.commit();
    updateThreadReadState(activeThreadId, new Date());
    closeModal();
  } catch(e) {
    toast('전송 실패: ' + e.message);
    btn.disabled = false;
  }
}
</script>
</body>
</html>
